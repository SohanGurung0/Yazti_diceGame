<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahtzee</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/objects/Reflector.js"></script>

    <!-- Babel for JSX (Used for the script.js which contains JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- gsc -->
    <meta name="google-site-verification" content="jlaRsrR7FT_ZspSsRV4Evflk391juHhhAU7bEXfrBME" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="sceneCanvas"></canvas>
    <div id="root" class="relative z-10 w-full min-h-screen flex justify-center pointer-events-none">
        <div id="loading"
            style="color: white; font-family: sans-serif; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;">
            Loading...</div>
    </div>

    <script>
        window.onerror = function (msg, url, line, col, error) {
            var extra = !col ? '' : '\ncolumn: ' + col;
            extra += !error ? '' : '\nerror: ' + error;
            console.log("Error: " + msg + "\nurl: " + url + "\nline: " + line + extra);
            var errDiv = document.createElement('div');
            errDiv.style = "position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.8);color:white;padding:20px;z-index:10000;font-family:monospace;";
            errDiv.innerText = "CRITICAL ERROR: " + msg + " at " + line + ":" + col;
            document.body.appendChild(errDiv);
            return false;
        };
    </script>

    <!-- Main Game Script (Type text/babel because it contains JSX) -->
    <script type="text/babel" src="script.js"></script>
</body>

</html>
